name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q etherlink
      - run: git diff --check
      - run: ./etherlink/hosts.py 'node[001-003,007]'
      - run: ./etherlink-cli --input examples/demo.json --svg /tmp/demo.svg --html /tmp/demo.html --quiet
